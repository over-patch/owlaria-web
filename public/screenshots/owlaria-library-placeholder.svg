<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Owlaria product preview placeholder</title>
  <desc id="description">Abstract Owlaria brand artwork labeled Product preview in progress.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33" />
      <stop offset="0.52" stop-color="#080d1d" />
      <stop offset="1" stop-color="#030611" />
    </linearGradient>
    <radialGradient id="purple-glow">
      <stop offset="0" stop-color="#a66cff" stop-opacity="0.74" />
      <stop offset="1" stop-color="#a66cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#4de4ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#4de4ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9db4ff" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1440" height="960" rx="48" fill="url(#surface)" />
  <ellipse cx="320" cy="220" rx="520" ry="420" fill="url(#purple-glow)" opacity="0.5" />
  <ellipse cx="1180" cy="740" rx="500" ry="400" fill="url(#cyan-glow)" opacity="0.42" />
  <rect width="1440" height="960" rx="48" fill="url(#grid)" />
  <path d="M120 760C360 550 540 640 720 470C900 300 1100 390 1320 180" fill="none" stroke="#80ecff" stroke-opacity="0.14" stroke-width="2" />

  <text x="720" y="580" fill="#f7f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="760" text-anchor="middle" letter-spacing="-1">
    Product preview in progress
  </text>
  <text x="720" y="630" fill="#aeb9d5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="3">
    OWLARIA · MACOS · IOS
  </text>
</svg>
